<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aahar – Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; }
  .hindi { font-family: 'Tiro Devanagari Hindi', serif; }
  .gradient-bg { background: linear-gradient(135deg, #064e3b 0%, #065f46 40%, #047857 100%); }
  .card { backdrop-filter: blur(16px); background: rgba(255,255,255,0.97); }
  .input-field { transition: border-color 0.2s, box-shadow 0.2s; }
  .input-field:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.15); }
  .btn-primary { background: linear-gradient(135deg, #059669, #047857); transition: opacity 0.2s, transform 0.1s; }
  .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .error-shake { animation: shake 0.4s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
</style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

  <!-- Background Pattern -->
  <div class="absolute inset-0 opacity-10" style="background-image:url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'0.4\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E')"></div>

  <div class="relative w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl shadow-xl mb-4">
        <span class="material-icons text-green-700 text-5xl">eco</span>
      </div>
      <h1 class="text-5xl font-bold text-white hindi">आहार</h1>
      <p class="text-green-200 mt-2 text-sm tracking-widest uppercase">Smart Agriculture Platform</p>
    </div>

    <!-- Login Card -->
    <div class="card rounded-2xl shadow-2xl p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-1">Welcome back</h2>
      <p class="text-gray-500 text-sm mb-7">Sign in to your account to continue</p>

      <div id="error-box" class="hidden mb-5 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm flex items-center gap-2">
        <span class="material-icons text-sm">error</span>
        <span id="error-msg">Invalid username or password.</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
          <div class="relative">
            <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xl">person</span>
            <input id="username" type="text" placeholder="Enter your username"
              class="input-field w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-gray-800 bg-gray-50 outline-none text-sm"
              autocomplete="username"/>
          </div>
        </div>

        <div class="mb-7">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <div class="relative">
            <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xl">lock</span>
            <input id="password" type="password" placeholder="Enter your password"
              class="input-field w-full pl-10 pr-11 py-3 border border-gray-200 rounded-xl text-gray-800 bg-gray-50 outline-none text-sm"
              autocomplete="current-password"/>
            <button type="button" onclick="togglePwd()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <span class="material-icons text-xl" id="pwd-eye">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary w-full text-white font-semibold py-3 rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">
          <span class="material-icons text-xl">login</span>
          Sign In
        </button>
      </form>

      <p class="text-center text-gray-400 text-xs mt-6">
        Aahar Precision Farming · Secure Portal
      </p>
    </div>
  </div>

<script>
// Hardcoded credentials
const USERS = {
  'admin':    { password: 'admin@2024',  role: 'admin',   name: 'Administrator',   farmer: null },
  'jaspreet': { password: 'jaspreet@123', role: 'farmer', name: 'Jaspreet Singh',  farmer: 'Jaspreet' },
  'netar':    { password: 'netar@123',   role: 'farmer',  name: 'Netar Singh',     farmer: 'Netar' },
  'muktiyar': { password: 'muktiyar@123',role: 'farmer',  name: 'Muktiyar Singh',  farmer: 'Muktiyar' },
};

function togglePwd() {
  const inp = document.getElementById('password');
  const eye = document.getElementById('pwd-eye');
  if (inp.type === 'password') { inp.type = 'text'; eye.textContent = 'visibility_off'; }
  else { inp.type = 'password'; eye.textContent = 'visibility'; }
}

function handleLogin(e) {
  e.preventDefault();
  const user = document.getElementById('username').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  const errBox = document.getElementById('error-box');
  const errMsg = document.getElementById('error-msg');

  if (!USERS[user] || USERS[user].password !== pass) {
    errBox.classList.remove('hidden');
    errMsg.textContent = 'Invalid username or password. Please try again.';
    document.getElementById('login-form').classList.add('error-shake');
    setTimeout(() => document.getElementById('login-form').classList.remove('error-shake'), 400);
    return;
  }

  errBox.classList.add('hidden');
  const u = USERS[user];
  sessionStorage.setItem('aahar_user', JSON.stringify({ username: user, ...u }));

  if (u.role === 'admin') window.location.href = 'admin.html';
  else window.location.href = 'farmer.html';
}

// If already logged in, redirect
const existing = sessionStorage.getItem('aahar_user');
if (existing) {
  const u = JSON.parse(existing);
  window.location.href = u.role === 'admin' ? 'admin.html' : 'farmer.html';
}
</script>
</body>
</html>
